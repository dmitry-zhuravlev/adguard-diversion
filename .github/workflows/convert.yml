name: Convert AdGuard Filters

on:
  schedule:
    - cron: '0 10 * * 6'  # Every Saturday at 10:00 UTC
  workflow_dispatch:        # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run convert.py
        run: python3 convert.py

      - name: Publish to gh-pages branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
          # Create orphan gh-pages branch with only the txt files
          mkdir -p /tmp/pages
          cp format/diversion/*.txt /tmp/pages/
          DATE=$(date '+%Y-%m-%d %H:%M UTC')
          echo "# AdGuard Diversion Filters" > /tmp/pages/index.md
          echo "" >> /tmp/pages/index.md
          echo "Last updated: $DATE" >> /tmp/pages/index.md
          echo "" >> /tmp/pages/index.md
          for f in /tmp/pages/*.txt; do
            NAME=$(basename "$f")
            SIZE=$(wc -l < "$f")
            echo "- [$NAME]($NAME) ($SIZE lines)" >> /tmp/pages/index.md
          done
          
          cd /tmp/pages
          git init
          git checkout -b gh-pages
          git add .
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git commit -m "Update filters $DATE"
          git remote add origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
